<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 1: Button Styles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        /* Shared base for every button style */
        .btn {
            padding: 0.75rem 1.5rem;
            border: 2px solid transparent;
            border-radius: 6px;
            font-family: inherit;
            font-size: var(--font-base);
            font-weight: 600;
            cursor: pointer;
        }

        /* 1. Primary: solid background */
        .btn-primary {
            background-color: var(--color-primary);
            border-color: var(--color-primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--color-primary-dark);
            border-color: var(--color-primary-dark);
        }

        /* 2. Secondary: outline */
        .btn-secondary {
            background-color: transparent;
            border-color: var(--color-primary);
            color: var(--color-primary);
        }

        .btn-secondary:hover {
            background-color: var(--color-primary);
            color: white;
        }

        /* 3. Danger: red */
        .btn-danger {
            background-color: #C62828;
            border-color: #C62828;
            color: white;
        }

        .btn-danger:hover {
            background-color: #8E1B1B;
            border-color: #8E1B1B;
        }

        /* 4. Disabled: grayed out, no hover effect */
        .btn:disabled,
        .btn:disabled:hover {
            background-color: #D9D9D9;
            border-color: #D9D9D9;
            color: #6B6B76;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <main>
        <h1>Day 1: Button Styles</h1>

        <div class="button-row">
            <button class="btn btn-primary">Primary</button>
            <button class="btn btn-secondary">Secondary</button>
            <button class="btn btn-danger">Danger</button>
            <button class="btn" disabled>Disabled</button>
        </div>
    </main>
</body>
</html>
